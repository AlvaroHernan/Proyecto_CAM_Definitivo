# Tema del dashboard (dashboard/app.py) con los colores de CORHUILA: verde, blanco y negro.
# El verde de la marca solo se usa en botones y controles; los bloques de color llenos
# (verde, amarillo, naranja, rojo) quedan reservados para los niveles de aviso.
[theme]
base = "light"
primaryColor = "#009540"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F6F4"
textColor = "#1D1D1B"

[server]
headless = true
