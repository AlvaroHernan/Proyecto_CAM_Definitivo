# Tema del dashboard (dashboard/app.py). El rojo, naranja, amarillo y verde se reservan
# para los niveles de aviso, así que los botones usan el azul de la interfaz.
[theme]
base = "light"
primaryColor = "#1F4E79"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F2F4F7"
textColor = "#1F2933"

[server]
headless = true
